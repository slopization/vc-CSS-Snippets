name: Update Classes

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_class]

permissions:
  contents: write

concurrency:
  group: class-update
  cancel-in-progress: false

jobs:
  classUpdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Replace renamed Discord classes
        run: |
          node --input-type=module - <<'EOF'
          import { appendFile, readdir, readFile, writeFile } from 'node:fs/promises';

          const DUMPS = 'https://raw.githubusercontent.com/itmesarah/DiscordClasses/main';
          const CHANGES = 'https://raw.githubusercontent.com/SyndiShanX/Update-Classes/main/Changes.txt';
          const HASHED = /\.(-?[A-Za-z][\w-]*?_(?:_[0-9a-f]{5}|[0-9a-f]{6}|[A-Za-z0-9_-]{6}))(?![\w-])/g;
          const readable = (c) => c.replace(/_[A-Za-z0-9_-]{6}$/, '');

          const get = async (url) => {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`${response.status} ${url}`);
            return response.text();
          };

          const classSets = (dump) => {
            const out = new Map();
            for (const [mid, mod] of Object.entries(dump)) {
              if (!mod || typeof mod !== 'object') continue;
              const values = Object.values(mod).filter((v) => typeof v === 'string');
              if (values.length) out.set(mid, [...new Set(values.flatMap((v) => v.split(' ').filter(Boolean)))]);
            }
            return out;
          };

          const previous = classSets(JSON.parse(await get(`${DUMPS}/stableclasses.json`)));
          const current = classSets(JSON.parse(await get(`${DUMPS}/canaryclasses.json`)));
          const live = new Set([...current.values()].flat());
          if (live.size < 10000) throw new Error(`class list looks truncated: ${live.size} classes`);

          const owner = new Map();
          for (const [mid, classes] of previous) for (const c of classes) if (!owner.has(c)) owner.set(c, mid);
          const currentNames = [...current].map(([mid, classes]) => ({ classes, names: new Set(classes.map(readable)) }));

          const byModule = (cls) => {
            const mid = owner.get(cls);
            if (!mid) return [];
            const name = readable(cls);
            const pick = (classes) => [...new Set(classes.filter((c) => readable(c) === name))];
            const same = current.get(mid);
            if (same && pick(same).length) return pick(same);
            const names = new Set(previous.get(mid).map(readable));
            let best = null;
            for (const c of currentNames) {
              if (!c.names.has(name)) continue;
              let shared = 0;
              for (const n of names) if (c.names.has(n)) shared++;
              const score = shared / (names.size + c.names.size - shared);
              if (!best || score > best.score) best = { score, classes: c.classes };
            }
            return best && best.score >= 0.5 ? pick(best.classes) : [];
          };

          const renames = new Map();
          const lines = (await get(CHANGES)).split(/\r?\n/);
          for (let i = 0; i + 1 < lines.length; i += 2) {
            if (!renames.has(lines[i])) renames.set(lines[i], []);
            renames.get(lines[i]).push(lines[i + 1]);
          }

          const successors = (name) => {
            const seen = new Set([name]);
            const queue = [name];
            while (queue.length) {
              for (const next of renames.get(queue.pop()) ?? []) {
                if (!seen.has(next)) {
                  seen.add(next);
                  queue.push(next);
                }
              }
            }
            return [...new Set([...seen].flatMap((c) => (live.has(c) ? [c] : byModule(c))))];
          };

          const report = [];
          for (const file of (await readdir('Snippets')).filter((f) => f.endsWith('.css'))) {
            const path = `Snippets/${file}`;
            const css = await readFile(path, 'utf8');
            const replaced = css.replace(HASHED, (match, name) => {
              if (live.has(name)) return match;
              const next = successors(name);
              if (next.length === 1) {
                report.push(`- ${file}: \`.${name}\` -> \`.${next[0]}\``);
                return `.${next[0]}`;
              }
              report.push(`- ${file}: \`.${name}\` needs a manual fix (${next.length ? next.join(', ') : 'no successor'})`);
              return match;
            });
            if (replaced !== css) await writeFile(path, replaced);
          }

          const summary = [`### Class update`, `${live.size} live classes`, '', ...new Set(report)].join('\n');
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);
          EOF

      - name: Commit updated snippets
        run: |
          git add Snippets
          if git diff --cached --quiet; then
            echo "No class changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(snippets): update renamed discord classes'
          git push
